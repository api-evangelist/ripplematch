aid: ripplematch
name: RippleMatch
description: >-
  RippleMatch is an AI-powered early-career recruiting platform that matches college
  students and recent graduates with internships and entry-level jobs based on their
  background, skills, and career goals rather than mass applications. For employers it
  offers "Campus OS", an all-in-one recruiting operating system for sourcing, skills
  validation, and campus event management, and it transfers matched candidates into most
  major applicant tracking systems (Greenhouse, Workday, Lever, SmartRecruiters, BambooHR).
  RippleMatch was surfaced as a portfolio company of Bullpen Capital and profiled in the
  API Evangelist network. As of this enrichment pass the company publishes no public
  developer portal, API reference, OpenAPI specification, SDKs, or webhook/event surface;
  its integrations are one-way ATS data transfers rather than an openly documented API.
